<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login — Presentation Master Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
    <style>
        /* Emergency fallback — guarantees page is visible even if styles.css fails */
        .form-container, .fade-in, .zoom-in { opacity: 1 !important; transform: none !important; }
    </style>
</head>
<body>
<header>
    <div class="header-container">
        <div class="logo-container">
            <img src="./logo.jpg" alt="Presentation Master Academy" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">
                <h1>PRESENTATION MASTER ACADEMY</h1>
                <p>Excellence in Testing & Student Assessment</p>
            </div>
        </div>
    </div>
</header>

<nav id="mainNav"></nav>

<section>
    <div class="section-container">
        <div class="section-title">
            <h2>Student Login</h2>
            <p style="color: #555; font-size: 1.1rem; margin-top: 1rem;">
                Enter the credentials sent to your email after approval.
            </p>
        </div>

        <div class="form-container" style="max-width: 480px;">
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="e.g. PMA-2026-1842" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
                </div>

                <button type="submit" class="cta-button" id="loginBtn" style="width:100%; border:none; cursor:pointer;">
                    Login
                </button>

                <div id="loginMessage" class="message"></div>

                <p style="text-align: center; margin-top: 1.5rem; color: #666;">
                    New applicant?
                    <a href="./register.html" style="color: #1a5276; font-weight: 600;">Apply Now</a>
                </p>
                <p style="text-align: center; margin-top: 0.5rem; color: #666; font-size: 0.9rem;">
                    Forgot password? Contact admin at <strong>03234296569</strong>
                </p>
            </form>
        </div>
    </div>
</section>


    <div class="copyright">
        <p>&copy; 2026 Presentation Master Academy. All rights reserved.</p>
    </div>
</footer>

<script src="./nav.js"></script>

<script type="module">
    import {
        auth, db, signInWithEmailAndPassword, usernameToEmail,
        doc, getDoc
    } from "./firebase.js";

    // Local helper (register.html uses firebase.js setMessage, same here)
    function showMessage(target, text, type = "ok") {
        const node = typeof target === "string" ? document.querySelector(target) : target;
        if (!node) return;
        node.textContent = text;
        node.className = `message ${type}`;
    }

    const form = document.getElementById("loginForm");
    const btn  = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        // Basic validation
        if (!username || !password) {
            showMessage("#loginMessage", "❌ Please enter both username and password.", "error");
            return;
        }

        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = "Logging in...";
        showMessage("#loginMessage", "", "");

        try {
            // Accept either a username (PMA-...) or a full email
            const email = username.includes("@") ? username : usernameToEmail(username);

            const cred = await signInWithEmailAndPassword(auth, email, password);

            // Verify student record exists in Firestore
            const snap = await getDoc(doc(db, "students", cred.user.uid));
            if (!snap.exists()) {
                throw new Error("Student record not found. Contact admin at 03234296569.");
            }

            localStorage.setItem("pma_student", JSON.stringify(snap.data()));
            showMessage("#loginMessage", "✅ Login successful! Redirecting...", "ok");

            setTimeout(() => {
                window.location.href = "./dashboard.html";
            }, 700);

        } catch (err) {
            console.error("Login error:", err);

            let msg = err.message || "Login failed. Please try again.";
            if (
                err.code === "auth/invalid-credential" ||
                err.code === "auth/wrong-password" ||
                err.code === "auth/user-not-found" ||
                err.code === "auth/invalid-email"
            ) {
                msg = "Invalid username or password.";
            } else if (err.code === "auth/too-many-requests") {
                msg = "Too many failed attempts. Please wait a few minutes and try again.";
            } else if (err.code === "auth/network-request-failed") {
                msg = "Network error. Please check your internet connection.";
            } else if (err.code === "auth/operation-not-allowed") {
                msg = "Login is disabled. Please contact admin.";
            }

            showMessage("#loginMessage", "❌ " + msg, "error");
        } finally {
            btn.disabled = false;
            btn.textContent = originalText;
        }
    });
</script>
</body>
</html>
